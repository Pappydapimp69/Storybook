<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A real job-scam text thread, replayed in order, with every trick on both sides labelled.">
<meta property="og:type" content="website">
<meta property="og:title" content="There's Someone in the Box">
<meta property="og:description" content="A real job-scam text thread, replayed with every trick labelled.">
<meta property="og:image" content="https://pappydapimp69.github.io/Storybook/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<title>There's Someone in the Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --desk:#F3C78F; --page:#FFF6E6; --ink:#4A2A14; --soft:#8A5A35; --hatch:#F2B77F; --accent:#D2553A; --ok:#4E9A64;
  --brass:#E0A21E; --glow:#FFE7A3; --shadow:#2B1A10; --glass:#EFE3CF; --sky1:#FFD98E; --sky2:#F59E5B; --ground:#D88F5C; --ground2:#C67C4B; --night:#3A2A4A;
  --me:#2F7CF6; --me-ink:#fff; --top:#FBEFDB;
  --serif:"Fredoka","Nunito",system-ui,sans-serif; --sans:"Nunito",system-ui,sans-serif; --hand:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1E2046; --page:#23264D; --ink:#F3EEFF; --soft:#C3BCE6; --hatch:#565A9E; --accent:#FF8A7A; --ok:#8EE0A8;
  --brass:#FFCB6B; --glow:#FFE3A3; --shadow:#0E0F26; --glass:#3A3D6E; --sky1:#2B3160; --sky2:#4A4C8C; --ground:#3E3F7A; --ground2:#34356A; --night:#1A1B3A;
  --me:#3B82F6; --me-ink:#fff; --top:#2C2F5C; color-scheme:dark}}
:root[data-theme="dark"]{--desk:#1E2046; --page:#23264D; --ink:#F3EEFF; --soft:#C3BCE6; --hatch:#565A9E; --accent:#FF8A7A; --ok:#8EE0A8;
  --brass:#FFCB6B; --glow:#FFE3A3; --shadow:#0E0F26; --glass:#3A3D6E; --sky1:#2B3160; --sky2:#4A4C8C; --ground:#3E3F7A; --ground2:#34356A; --night:#1A1B3A;
  --me:#3B82F6; --me-ink:#fff; --top:#2C2F5C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans)}
.shell{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.book{position:relative;width:100%;max-width:460px;height:min(calc(100dvh - 48px),860px);min-height:480px;background:var(--page);border-radius:30px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.35);border:8px solid var(--shadow);display:flex;flex-direction:column}
.top{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px 8px;background:var(--top);border-bottom:1px solid var(--hatch)}
.top .av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--page);display:grid;place-items:center;font:700 1.3rem var(--serif)}
.top b{font:800 .95rem var(--sans)} .top small{font-size:.72rem;color:var(--soft)}
.art{display:none}
.words{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.line{margin:0;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.line.on{opacity:1;transform:none}
.line.v{align-self:center;text-align:center;max-width:92%;font:400 1.02rem/1.35 var(--serif);color:var(--ink);padding:6px 4px}
.line.cap{align-self:center;text-align:center;max-width:92%;font-size:.78rem;color:var(--soft)}
.line.cap::before{content:"HOW WE KNOW · ";font-weight:800;letter-spacing:.06em;font-size:.68rem}
.line.ts{align-self:center;font-size:.72rem;font-weight:800;color:var(--soft);padding-top:8px}
.line.mags{align-self:center;text-align:center;max-width:88%;font:400 1.1rem/1.3 var(--hand);background:var(--glow);color:#4A2A14;border-radius:14px;padding:6px 12px}
.line.mags::before{content:"MAGS: ";font:800 .68rem var(--sans);letter-spacing:.06em}
.line.kid{align-self:flex-end;text-align:right;max-width:80%;font:400 1.05rem var(--hand);color:var(--soft)}
.line.kid::before{content:"YOU, THINKING: ";font:800 .66rem var(--sans);color:var(--accent)}
.line.chat{white-space:pre-line;max-width:80%;padding:8px 12px;border-radius:20px;font:600 1rem/1.35 var(--sans)}
.line.chat .who{display:block;font-size:.6rem;letter-spacing:.08em;opacity:.75;margin-bottom:1px}
.line.chat .who+br{display:none}
.line.chat.charlie{align-self:flex-start;background:var(--glass);color:var(--ink);border-bottom-left-radius:6px}
.line.chat.you{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.line.chat.pred{background:transparent;border:2px dashed var(--soft);color:var(--ink)}
.line.chat.you.pred{border-color:var(--me)}
.line.chat .trick{display:table;margin:0 0 4px 0;padding:1px 8px;border-radius:999px;font:800 .62rem/1.6 var(--sans);letter-spacing:.06em;background:var(--accent);color:#fff}
.line.chat small{opacity:.75}
.line.img{align-self:flex-start;max-width:78%;background:var(--glass);border-radius:18px;padding:4px}
.line.img img{display:block;width:100%;border-radius:14px}
.line.img span{display:block;font:800 .6rem var(--sans);letter-spacing:.06em;color:var(--soft);padding:4px 6px 2px}
.typing{align-self:flex-start;background:var(--glass);border-radius:20px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--soft);opacity:.5}
@media (prefers-reduced-motion:no-preference){.typing i{animation:pulse 1s ease-in-out infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}}
.say{margin:0 10px;padding:6px 12px;border-radius:14px;background:var(--glow);color:#4A2A14;font:400 1.05rem/1.3 var(--hand);text-align:center}
.say:not(.on){display:none}
.say p{margin:0}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding:6px 10px}
.chips:empty{display:none}
.chips .meter{flex-basis:100%;text-align:center;font-size:.7rem;font-weight:800;color:var(--soft)}
.chips .btn{border-color:var(--me);color:var(--me);background:transparent;min-height:44px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--hatch);background:var(--top)}
.btn{font:800 1rem var(--sans);min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:var(--page);color:var(--ink);cursor:pointer}
.btn.main{background:var(--ink);color:var(--page)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.prog{flex:1;min-width:40px;height:6px;background:var(--hatch);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--me)}
select.btn{padding:0 6px;font-size:.85rem}
[hidden]{display:none!important}
.splash{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;border:0;cursor:pointer;background:linear-gradient(var(--sky1),var(--sky2));color:var(--ink);font-family:var(--serif)}
.splash .sbig{font:700 clamp(1.6rem,6vw,2.4rem) var(--serif);text-align:center;padding:0 16px}
.splash .stap{font:800 1.2rem var(--sans);padding:16px 32px;border-radius:999px;border:3px solid var(--ink);background:var(--page)}
.splash:focus-visible{outline:4px solid var(--accent);outline-offset:-8px}
@media (prefers-reduced-motion:no-preference){.splash .stap{animation:pulse 1.4s ease-in-out infinite}}
.poster{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--page);padding:20px;text-align:center}
.poster button{font:800 1.2rem var(--sans);min-height:64px;padding:0 30px;border-radius:999px;border:0;background:var(--me);color:#fff;cursor:pointer}
.poster .t{font:700 clamp(1.4rem,6vw,2rem) var(--serif)} .poster .s{font:500 .9rem var(--sans);color:var(--soft)}
.note{font-size:.78rem;color:var(--soft);max-width:460px;text-align:center;margin:0}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.hud{position:relative;display:flex;justify-content:space-around;gap:6px;padding:6px 10px;background:var(--top);border-bottom:1px solid var(--hatch);font:600 .85rem var(--sans)}
.hud b{font-weight:800}
.hud .pop{position:absolute;left:50%;top:100%;transform:translateX(-50%);z-index:4;white-space:nowrap;font:800 .85rem var(--sans);font-style:normal;background:var(--ok);color:#fff;padding:3px 10px;border-radius:999px;pointer-events:none}
.hud .pop.bad{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.hud .pop{animation:popup 1.6s ease-out forwards}}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-4px)}15%{opacity:1;transform:translate(-50%,4px)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>

<div class="shell">
  <main class="book" aria-label="There's Someone in the Box, a picture-book film">
    <header class="top"><div class="av" aria-hidden="true">C</div><b>Charlie</b><small>+1 (804) 451-8249 · Text message</small></header>
    <div class="hud" id="hud" aria-live="polite"><span>⏱ <b>0s</b> wasted</span><span>🛡 ●●●</span><span>⭐ <b>90</b></span></div>
    <div class="art" id="art"></div>
        <button class="splash" id="splash" type="button" aria-label="Tap to start with sound"><span class="sbig">There's Someone in the Box</span><span class="stap">Tap to start ♪</span></button>
    <div class="poster" id="poster">
      <button id="play2" type="button">▶ Play</button><button id="play" type="button" hidden>Watch</button>
      <div class="t">There's Someone in the Box</div>
      <div class="s">Waste the scammer's time. Keep your 3 shields. Every yes costs one. · sound on</div>
    </div>
    <div class="words" id="words" aria-live="polite"></div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="bar">
      <button class="btn" id="back" type="button" aria-label="Back one page">⏮</button>
      <button class="btn main" id="pause" type="button" aria-label="Pause">❚❚</button>
      <button class="btn" id="next" type="button" aria-label="Next page">⏭</button>
      <div class="prog" aria-hidden="true"><i id="prog"></i></div>
      <select class="btn" id="speed" aria-label="Text speed">
        <option value="1.6">Slow text</option><option value="2.6" selected>Normal text</option><option value="3.6">Fast text</option>
      </select>
      <button class="btn" id="snd" type="button" aria-label="Sound on">🔊</button>
    </div>
  </main>
  <p class="note">A game made from a real scam text thread. You choose what to say. No sound? Check the silent switch.</p>
</div>

<script type="module" src="./book/film.js"></script>

</body>
</html>
